version: "3.9"

services:
  lib:
    build: .
    container_name: library
    env_file:
      - .env
    depends_on:
     db:
        condition: service_healthy
    
  db:
    image: mariadb:11
    container_name: dB
    ports:
      -"3306:3306"
    healthcheck:
      test: ["CMD", "sqladmin", "ping" ,"-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:var/lib/mysql

volumes:
  mysql_data:
