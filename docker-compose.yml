services:
  lib:
    build: .
    container_name: lms_lib
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
     db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: lms_db
    ports:
      - "3307:3306"
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s

  frontend:
      image: nginx:alpine
      container_name: lms_frontend
      ports:
        - "5500:80"
      volumes:
        - ./frontend:/usr/share/nginx/html:ro
      depends_on:
        - lib
        
volumes:
  mysql_data:




